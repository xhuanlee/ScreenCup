[package]
name = "screencut"
version = "0.1.0"
description = "Cross-platform screen recorder built with Rust + Tauri"
authors = ["ScreenCut"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "screencut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }

# Screen capture (macOS ScreenCaptureKit / Windows Graphics Capture)
scap = "=0.1.0-beta.1"

# Audio capture: mic (macOS CoreAudio / Windows WASAPI) + Windows system loopback
cpal = "0.15"

# macOS: NSWindow windowNumber lookup for capture exclusion
objc = "0.2.7"
png = "0.18.1"

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.release.package."*"]
opt-level = 3

# Local patch of scap 0.1.0-beta.1: the upstream mac code resolves window
# geometry via `NSApp -windowWithWindowNumber:`, which returns nil for other
# processes' windows and aborts the app with a null dereference. The vendored
# copy queries the cross-process CGWindowList API instead.
[patch.crates-io]
scap = { path = "../vendor/scap" }
