name: ci

# Build + test on every push and pull request so regressions are caught
# before they reach a tagged release.
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        run: pnpm exec tsc -b

      - name: Build frontend
        run: pnpm exec vite build

  # Rust tests run on macOS, the platform the capture stack is verified on.
  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Rust unit + integration tests
        working-directory: src-tauri
        run: cargo test --locked

  # Compile-check the Windows build. The capture stack can only be verified on
  # its target platform, and a full release build takes a while, so this is a
  # cheap guard that runs on every push.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Compile-check the Windows capture stack
        working-directory: src-tauri
        run: cargo check --locked
