name: release

# Build native bundles for macOS and Windows and attach them to a GitHub
# Release whenever a version tag (v*) is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The vendored scap is a path dependency, so it ships with the repo and
      # needs no network access to fetch.
      #
      # No code signing is configured: the bundles are ad-hoc signed and
      # Gatekeeper asks the user to confirm on first launch, which is fine for
      # a beta. To sign, set APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
      # APPLE_SIGNING_IDENTITY (and TAURI_SIGNING_PRIVATE_KEY for the updater)
      # as repository secrets and pass them here — passing them *empty*
      # currently makes the bundler try to import an empty certificate and
      # fails the build.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ScreenCut ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the latest build for your platform."
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
