name: release

# Build native bundles for macOS and Windows and attach them to a GitHub
# Release whenever a version tag (v*) is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # A single universal binary covers both Apple Silicon and Intel
          # Macs; separate x86_64 runners are scarce on the free tier.
          - platform: macos-14
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            target: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The vendored scap is a path dependency, so it ships with the repo and
      # needs no network access to fetch.
      #
      # macOS: an *ad-hoc* signature (`-`) is used on purpose. Tauri otherwise
      # leaves the .app carrying only the linker's implicit signature, whose
      # identifier (e.g. `screencut-0c69cad04cfc4d8c`) is random per build.
      # macOS TCC keys every permission grant — screen recording, microphone —
      # on the code-signing identity, so an unstable identifier makes the app
      # re-prompt for the microphone on every launch and can leave the Screen
      # Recording toggle in System Settings visibly on while the running
      # process still has no permission. Signing with the bundle's own stable
      # identifier (`com.screencut.app`) lets TCC remember the grants.
      # Gatekeeper still asks once on first launch, which is fine for a beta.
      # To ship a properly signed build, set APPLE_CERTIFICATE /
      # APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY (and
      # TAURI_SIGNING_PRIVATE_KEY for the updater) as repository secrets and
      # pass them here.
      #
      # Two near-duplicate steps rather than one with a conditional env value:
      # passing APPLE_SIGNING_IDENTITY *empty* on Windows makes the bundler
      # try to import an empty certificate and fails the build.
      - uses: tauri-apps/tauri-action@v0
        if: matrix.platform == 'macos-14'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ScreenCut ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the latest build for your platform."
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        if: matrix.platform != 'macos-14'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ScreenCut ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the latest build for your platform."
          releaseDraft: false
          prerelease: true
